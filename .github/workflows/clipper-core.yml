name: Clipper Core

# SECURITY: only schedule and manual dispatch — never pull_request or
# pull_request_target, which would expose secrets to fork PRs.
on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours — the operator uploads at unpredictable times
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit state/ changes back to the repo

jobs:
  clipper-core:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # long-form video processing can take a while
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          pip install google-api-python-client google-auth requests \
                      mediapipe opencv-python-headless numpy

      - name: Run Clipper Core
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INCOMING_FOLDER_ID: ${{ secrets.DRIVE_INCOMING_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
        run: python scripts/clipper_core.py

      - name: Commit state changes
        if: always()  # commit state even if the run partially failed — partial progress must be saved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update pipeline state after Clipper Core run [skip ci]"
          git push
